version: 2

models:
  - name: metricflow_time_spine
    description: MetricFlow time spine — one row per day from 2020 to 2025.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: One row per calendar day.
        granularity: day
        tests: [unique, not_null]
