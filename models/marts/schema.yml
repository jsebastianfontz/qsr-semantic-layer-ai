version: 2

models:
  - name: dim_store
    description: Store dimension with enriched attributes and same-store eligibility flag.
    columns:
      - name: store_id
        tests: [unique, not_null]
      - name: region
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Northeast, Southeast, West, Midwest]
      - name: open_date
        tests: [not_null]
      - name: is_same_store_eligible
        tests: [not_null]
      - name: months_since_open
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: dim_date
    description: Date dimension spanning the full analysis period.
    columns:
      - name: date_day
        tests: [unique, not_null]
      - name: year
        tests: [not_null]
      - name: month
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 1 and 12"
      - name: is_weekend
        tests: [not_null]

  - name: fct_daily_sales
    description: >
      Daily sales fact table joining sales, store, date, and targets.
      One row per store per day.
    columns:
      - name: store_id
        tests: [not_null]
      - name: sale_date
        tests: [not_null]
      - name: net_sales
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: digital_mix_pct
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
      - name: avg_ticket_value
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
